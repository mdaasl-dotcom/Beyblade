<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your License Key</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="claim-page">
    <div class="claim-card">
      <h1>Thanks for your purchase!</h1>
      <p id="claim-status">Getting your license key&hellip;</p>
      <div id="claim-key" class="claim-key-display" hidden></div>
      <div class="claim-actions">
        <button id="claim-copy" type="button" hidden>Copy key</button>
        <a id="claim-open-app" class="button-link" href="index.html" hidden>Open the app</a>
      </div>
    </div>
  </div>
  <script type="module" src="src/claim.js"></script>
</body>
</html>
