<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spin Battle Tracker</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="walkthrough" role="dialog" aria-modal="true" aria-labelledby="walkthrough-title">
      <div class="walkthrough-card">
        <button id="walkthrough-skip" class="walkthrough-skip" type="button">Skip</button>
        <div class="walkthrough-icon" id="walkthrough-icon"></div>
        <div class="walkthrough-dots" id="walkthrough-dots"></div>
        <h2 id="walkthrough-title"></h2>
        <p id="walkthrough-body"></p>
        <div class="walkthrough-actions">
          <button id="walkthrough-back" class="walkthrough-secondary" type="button">Back</button>
          <button id="walkthrough-next" class="walkthrough-primary" type="button">Next</button>
        </div>
      </div>
    </div>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="hud-canvas"></canvas>

    <header id="topbar">
      <div class="scoreboard" id="scoreboard">
        <div class="player" id="player-a">
          <span class="swatch" id="swatch-a"></span>
          <span class="name" contenteditable="true" id="name-a">Player A</span>
          <span class="wins" id="wins-a">0</span>
        </div>
        <div class="vs">VS</div>
        <div class="player" id="player-b">
          <span class="name" contenteditable="true" id="name-b">Player B</span>
          <span class="swatch" id="swatch-b"></span>
          <span class="wins" id="wins-b">0</span>
        </div>
      </div>
      <div id="status-line">Tap "Start Camera" to begin.</div>
    </header>

    <div id="event-toast" class="hidden"></div>

    <footer id="controls">
      <div class="step-row">
        <button id="btn-start-camera">1. Start Camera</button>
        <button id="btn-calibrate-stadium" disabled>2. Calibrate Stadium</button>
        <button id="btn-calibrate-a" disabled>3. Calibrate Player A</button>
        <button id="btn-calibrate-b" disabled>4. Calibrate Player B</button>
      </div>
      <div class="step-row">
        <select id="camera-select" hidden aria-label="Choose camera"></select>
      </div>
      <div class="step-row" id="zoom-row" hidden>
        <button id="btn-zoom-out" aria-label="Zoom out">&minus;</button>
        <span id="zoom-label">1.0x</span>
        <button id="btn-zoom-in" aria-label="Zoom in">+</button>
      </div>
      <div class="step-row">
        <button id="btn-start-match" disabled>Start Match</button>
        <button id="btn-reset-round" disabled>Reset Round</button>
        <button id="btn-enter-ar" disabled>Enter AR</button>
        <button id="btn-debug-view">Show Debug View</button>
      </div>
      <div class="step-row" id="tolerance-row" hidden>
        <label id="tolerance-label" for="tolerance-slider">Match tightness: 14&deg;</label>
        <input type="range" id="tolerance-slider" min="4" max="35" value="14" step="1" />
      </div>
      <div id="help-text">
        Stadium calibration: tap 6-8 points around the rim of the stadium bowl, then press "Finish".
      </div>
      <div id="log-panel"></div>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
